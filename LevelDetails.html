<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="level_details_page_title">Level Details | KaizoList</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/kaizolistlogo.png" />
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/app/icon-192.png">
  <meta name="theme-color" content="#161616">
  <link rel="canonical" href="https://kaizolist.com/LevelDetails.html" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7N58SZ0J6W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-7N58SZ0J6W');
  </script>
</head>
<body>

  <div id="badge-modal" class="badge-modal hidden">
    <div class="badge-modal-content">
        <img id="modal-badge-icon" />
        <h2 id="modal-badge-title"></h2>
        <p id="modal-badge-description"></p>
        <button id="close-modal" class="hub-button" style="margin-top: 20px;" data-i18n="close_button">Close</button>
    </div>
  </div>

<div class="settings-menu">
    <div class="lang-switcher">
        <button onclick="window.setLanguage('en')" id="flag-en" title="English"></button>
        <button onclick="window.setLanguage('es')" id="flag-es" title="Español"></button>
    </div>
    
    <button onclick="toggleDarkMode()" id="theme-toggle" title="Toggle Dark Mode">
        <span id="theme-icon"></span>
    </button>
</div>

<div class="background-stage">
  <div class="sky-layer"></div>
  <div class="sunset-mask"></div>
  <div class="sunset-decor back"></div>
  <div class="sunset-decor front"></div>
</div>

  <div class="container panel-9slice">
      <div id="level-topbar">
          <a href="#" id="back-button" class="hub-button" data-i18n="nav_back">Back</a>
      </div>

      <div id="title-row">
          <div id="title-left" class="board-9slice">
              <h1 id="level-name"></h1>
          </div>

          <div id="badges-container-right" class="board-9slice">
              <div id="badge-row"></div>
              <div id="series-badge"></div>
          </div>
      </div>

      <div class="level-columns">
          <div class="level-column">
              <h2 class="label-board board-9slice"><img class="kl-label-ico" src="images/icon/victor.png" width="24" height="28" alt=""><span data-i18n="victors_title">Victors</span></h2>
              <div id="victors-grid" class="grid panel-9slice"></div>
          </div>

          <div class="level-column">
              <h2 class="label-board board-9slice"><img class="kl-label-ico" src="images/icon/info.png" width="22" height="26" alt=""><span data-i18n="level_info_title">Level Info</span></h2>
              <div id="level-info" class="panel-9slice">

                  <p><img class="kl-info-ico" src="images/icon/creator.png" width="32" height="32" alt=""><strong data-i18n="creator">Creator:</strong> <span id="level-creator"></span></p>
                  <p><img class="kl-info-ico" src="images/icon/victor.png" width="24" height="28" alt=""><strong data-i18n="verifier">Verifier:</strong> <span id="level-verifier"></span></p>
                  <p><img class="kl-info-ico" src="images/icon/id.png" width="22" height="26" alt=""><strong data-i18n="id">ID:</strong> <span id="level-id">N/A</span></p>
                  <p id="level-klp-row"><strong>KLP:</strong> <span id="level-klp">0</span></p>
                  <p><img class="kl-info-ico" src="images/icon/rank.png" width="22" height="26" alt=""><strong data-i18n="rank_label">Rank:</strong> <span id="level-rank">0</span></p>
                  <p id="level-legacy-date-row" class="hidden"><strong data-i18n="legacy_since_label">Moved to Legacy:</strong> <span id="level-legacy-date">N/A</span></p>
                  <p id="level-enjoyment-row"><img class="kl-info-ico" src="images/icon/enjoyment.png" width="22" height="26" alt=""><strong data-i18n="enjoy_label">Enjoyment:</strong> <span id="level-enjoyment"><span class="kl-loading kl-loading-sm"></span></span></p>
                  <div id="level-rate" class="level-rate hidden"></div>
              </div>
          </div>
      </div>

      <section id="level-layout-section" class="hidden">
          <h2 class="label-board board-9slice" data-i18n="layout_title">Layout</h2>
          <div id="level-layout" class="panel-9slice"></div>
      </section>

      <section id="level-history-section">
          <h2 class="label-board board-9slice" data-i18n="history_title">History</h2>
          <div id="history" class="panel-9slice"><div class="kl-loading-block"><span class="kl-loading"></span></div></div>
      </section>

      <section id="level-comments-section" class="comments-section">
          <h2 class="label-board board-9slice"><span data-i18n="comments_title">Comments</span> <span class="comments-count"></span></h2>
          <div id="level-comments" class="panel-9slice"></div>
      </section>
  </div>

  <script type="module">
      import { applyRandomPattern } from './js/utils.js';
      import { applyTranslations } from './js/i18n.js';

      const patterns = Array.from({ length: 13 }, (_, i) => `/images/pattern/pattern${i}.png`);
      applyRandomPattern('.hub-button', patterns);
      
      applyTranslations();
  </script>

  <script type="module" src="./levelDetails.js"></script>
</body>
</html>
